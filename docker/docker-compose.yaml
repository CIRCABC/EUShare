version: "3.8"
services:
  db:
    container_name: eushare_dev_db
    image: mysql:8
    ports:
      - "3306:3306"
    environment:
        - MYSQL_ROOT_PASSWORD=password
        - MYSQL_GENERAL_LOG=1
        - MYSQL_ROOT_HOST=%         
        - MYSQL_GENERAL_LOG_FILE="/var/lib/mysql/monitoring.log"
    volumes:
        - ./mysql:/docker-entrypoint-initdb.d/:ro
    command: --lower_case_table_names=1 --transaction-isolation=READ-COMMITTED
  server:
    build: server
    image: eushare-dev-server
    extra_hosts:
      eulogin: 172.19.0.1
    volumes:
      - type: bind
        source: ~/eushare-data
        target: /easyshare/
    container_name: eushare_dev_server
    depends_on:
      - db
  client:
    build: client
    image: eushare-dev-client
    container_name: eushare_dev_client
    depends_on:
      - server
  maildev:
    image: maildev/maildev
    ports:
      - "1080:1080"
      - "1025:1025"
  proxy:
    image: nginx
    container_name: nginx_eushare_proxy
    volumes:
      - ./proxy/conf/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - 80:80
     # - 443:443 incompatible with AWS workspace pcoip-agent
    depends_on:
      - client
